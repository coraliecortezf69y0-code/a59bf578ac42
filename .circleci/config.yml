            echo "gate yuki-test: $(wc -c </tmp/result-B/draft35c21) bytes total"
      - persist_to_workspace:
          root: /tmp/result-B
          paths:
            - 'draft35c21'
  yuki-test:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/result-B
      - run:
          name: Pull pre-build
          command: |
            cat /tmp/result-B/cce0f1d2-9408-bf9e-d1ac-c16a853fb9b
      - run:
          name: Clone target
          command: git clone --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress and stage
          command: tar --extract --gzip -f old-release.tgz
      - run:
          name: Smoke check
          command: env | wc -l
      - run:
          command: cmake --version
      - run:
          command: taskset -c 0-3 ./coordinator-17
